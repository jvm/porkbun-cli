name: Security

on:
  push:
    branches: [main]
  pull_request:
    paths: ["src/**", "package.json", "pnpm-lock.yaml", ".github/workflows/**"]
  schedule:
    - cron: "37 4 * * 2"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Setup pnpm
        uses: pnpm/action-setup@0e279bb959325dab635dd2c09392533439d90093 # v6.0.8
        with:
          package_json_file: "package.json"
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - name: Audit production dependencies
        run: pnpm audit --prod --audit-level=high

  secrets:
    name: Secret scan (betterleaks)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install betterleaks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          BETTERLEAKS_VERSION=1.5.0
          curl -sSfL \
            "https://github.com/betterleaks/betterleaks/releases/download/v${BETTERLEAKS_VERSION}/betterleaks_${BETTERLEAKS_VERSION}_linux_x64.tar.gz" \
            -o /tmp/betterleaks.tar.gz
          tar -xzf /tmp/betterleaks.tar.gz -C /tmp betterleaks
          install -m 0755 /tmp/betterleaks /usr/local/bin/betterleaks
          betterleaks --version
      - name: Run betterleaks (working tree)
        run: |
          betterleaks dir . \
            --no-banner --redact --exit-code=2 \
            --report-path betterleaks.sarif \
            --report-format sarif
      - name: Upload betterleaks SARIF
        if: always()
        uses: github/codeql-action/upload-sarif@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
        with:
          sarif_file: betterleaks.sarif

  codeql:
    name: CodeQL analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
        with:
          languages: javascript-typescript
          queries: security-extended,security-and-quality
      - uses: github/codeql-action/autobuild@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6
      - uses: github/codeql-action/analyze@c35d1b164463ee62a100735382aaaa525c5d3496 # codeql-bundle-v2.25.6

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run ShellCheck when shell scripts are present
        run: |
          mapfile -t scripts < <(find . -type f -name '*.sh' \
            -not -path './node_modules/*' \
            -not -path './.git/*' \
            -not -path './dist/*')
          if [ "${#scripts[@]}" -eq 0 ]; then
            echo "No shell scripts found; skipping."
          else
            shellcheck -e SC1090,SC2154 "${scripts[@]}"
          fi

  workflow-lint:
    name: Workflow lint (actionlint + zizmor)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: raven-actions/actionlint@205b530c5d9fa8f44ae9ed59f341a0db994aa6f8 # v2.1.2
        with:
          ignore: SC1091
      - name: Install zizmor
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download --repo zizmorcore/zizmor \
            --pattern 'zizmor-x86_64-unknown-linux-gnu.tar.gz' \
            --output /tmp/zizmor.tar.gz
          tar xzf /tmp/zizmor.tar.gz -C /usr/local/bin zizmor
          chmod +x /usr/local/bin/zizmor
      - name: Run zizmor
        run: |
          zizmor --color always \
                 --persona auditor \
                 --min-severity high \
                 --min-confidence medium \
                 .github/workflows/
